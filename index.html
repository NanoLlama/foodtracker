<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <title>Food Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>Food Tracker</h1>
    </header>

    <div id="notices" aria-live="polite"></div>

    <main id="main">
      <section class="view" id="view-today" data-view="today" hidden></section>
      <section class="view" id="view-foods" data-view="foods" hidden></section>
      <section class="view" id="view-weight" data-view="weight" hidden></section>
      <section class="view" id="view-history" data-view="history" hidden></section>
      <section class="view" id="view-settings" data-view="settings" hidden></section>
    </main>

    <nav class="tabs" aria-label="Sections">
      <button type="button" data-nav="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Today</span>
      </button>
      <button type="button" data-nav="foods">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Foods</span>
      </button>
      <button type="button" data-nav="weight">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>
        <span>Weight</span>
      </button>
      <button type="button" data-nav="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
        <span>History</span>
      </button>
      <button type="button" data-nav="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <dialog id="ask" class="ask" aria-labelledby="ask-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
